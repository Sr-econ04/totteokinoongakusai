  /* 基本のリセット */
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  body{margin:0}
  [hidden]{display:none!important}

  /* ライトモード（基本） */
  :root{
    --bg:#F4F4F7;
    --panel:#FFFFFF;
    --line:#83838F;
    --ink:#111118;
    --mute:#3C3C48;
    --sel-bg:#111118;
    --sel-ink:#FFFFFF;
    --sel-sub:#E4E4EA;
    --focus:#0047FF;
    --font:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
  }
  /* ダークモード（端末の設定に合わせる） */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#000000; --panel:#1C1C22; --line:#6E6E7A; --ink:#FFFFFF; --mute:#D2D2DA;
      --sel-bg:#FFFFFF; --sel-ink:#000000; --sel-sub:#2A2A32; --focus:#FFE600;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000000; --panel:#1C1C22; --line:#6E6E7A; --ink:#FFFFFF; --mute:#D2D2DA;
    --sel-bg:#FFFFFF; --sel-ink:#000000; --sel-sub:#2A2A32; --focus:#FFE600;
  }

  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:17px;line-height:2.2;letter-spacing:.06em;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  }
  ruby rt{font-size:max(.55em,9px);font-weight:400;letter-spacing:.02em}
  button{font-family:var(--font);letter-spacing:.06em}
  :focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

  .setup{
    max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;
    padding:24px 20px 40px;display:flex;flex-direction:column;gap:44px;
  }
  header{display:flex;flex-direction:column;gap:14px}
  header h1{font-size:32px;font-weight:700;line-height:1.4;margin:0;letter-spacing:.1em}
  .rainbow{display:flex;height:8px;border-radius:4px;overflow:hidden}
  .rainbow span{flex:1}
  header p{margin:0;color:var(--mute)}

  section{display:flex;flex-direction:column;gap:16px}
  h2{font-size:20px;font-weight:700;margin:0;line-height:2}
  h2 .step{display:inline-block;margin-right:.5em}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modes button{
    appearance:none;border:3px solid var(--line);border-radius:18px;min-height:104px;padding:14px 8px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-size:clamp(16px,4.6vw,19px);font-weight:700;line-height:1.9;letter-spacing:.03em;white-space:nowrap;
  }
  .modes button small{white-space:normal;word-break:keep-all;text-align:center;font-size:14px;font-weight:400;line-height:1.9;color:var(--mute)}
  .modes button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
  .modes button[aria-pressed="true"] small{color:var(--sel-sub)}
  .modes .chk{display:none}
  .modes button[aria-pressed="true"] .chk{display:inline}

  /* 10色を2列×5段に。どのボタンも「左に色の見本・右に色の名前」の同じ形にそろえる */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .sw{
    appearance:none;position:relative;border:3px solid var(--line);border-radius:18px;
    background:var(--panel);padding:8px 10px;min-height:72px;
    display:flex;flex-direction:row;align-items:center;gap:clamp(8px,3vw,14px);text-align:left;
    color:var(--ink);font-size:clamp(15px,4.8vw,19px);font-weight:700;line-height:1.9;letter-spacing:.02em;white-space:nowrap;cursor:pointer;
  }
  .sw:active{transform:scale(.97)}
  #sw-white i,#pc-white i{box-shadow:inset 0 0 0 2px #83838F}   /* 白い見本が白い地に溶けないように縁を付ける */
  .sw i{display:block;flex:none;width:clamp(34px,13vw,64px);height:44px;border-radius:10px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .sw.on{border-color:var(--ink);border-width:4px;padding:7px 9px;box-shadow:0 0 22px -4px var(--c)}
  .sw b{
    position:absolute;top:-12px;right:-10px;min-width:36px;height:36px;padding:0 4px;box-sizing:border-box;
    border-radius:18px;background:var(--sel-bg);color:var(--sel-ink);border:3px solid var(--bg);
    font-size:18px;font-weight:700;line-height:30px;letter-spacing:0;text-align:center;display:none
  }
  .sw.on b{display:block}

  .tools{display:flex;gap:14px}
  .mini{
    flex:1;appearance:none;border:3px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:16px;min-height:60px;padding:8px 10px;font-size:16px;font-weight:700;line-height:1.9;cursor:pointer
  }
  .seqbox{padding:14px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .seqbox h3{margin:0;font-size:15px;font-weight:700;color:var(--mute);line-height:2}
  .seq{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:40px;margin:0;padding:0;list-style:none}
  .seq li{
    display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
    background:var(--c);border:2px solid var(--ink);color:#000;font-size:15px;font-weight:700;line-height:1;letter-spacing:0
  }
  .seq li.dk{color:#fff}
  .seq .empty{width:auto;height:auto;border:0;background:none;color:var(--mute);font-size:16px;font-weight:400;line-height:2}
  .hint{font-size:16px;font-weight:700;color:var(--ink);margin:0;text-align:center}
  .hint:empty{display:none}

  .gowrap{margin-top:auto;display:flex;flex-direction:column;gap:20px}
  .go{
    appearance:none;border:0;border-radius:22px;min-height:88px;padding:12px;
    background:var(--sel-bg);color:var(--sel-ink);font-size:28px;font-weight:700;line-height:1.7;letter-spacing:.14em;cursor:pointer;
    box-shadow:0 10px 36px -10px var(--go,transparent);
  }
  .go:disabled{opacity:.4;box-shadow:none}
  .note{margin:0;padding:16px 18px;border-radius:16px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;list-style:none;font-size:15px;color:var(--mute)}
  .note li{line-height:2.1;word-break:keep-all}

  /* 点灯画面（テーマに関係なく同じ見た目） */
  /* 背景はツールバーの裏まで塗るため大きめ（100lvh）。
     ボタン・案内・パネルは「実際に見えている画面」を基準に置く（position:fixed）。
     iPhoneのSafariで、ツールバーが出ているときにパネルの下が隠れないようにするため */
  .light{position:fixed;top:0;left:0;right:0;bottom:0;min-height:100lvh;background:#000;z-index:10;touch-action:none}
  /* 点灯中は後ろのページを消し、スクロールも止める（後ろが透けてガタつくのを防ぐ） */
  html.lit,html.lit body{overflow:hidden;overscroll-behavior:none}
  .hud{
    position:fixed;left:0;right:0;top:0;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;
    display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;transition:opacity .3s;
  }
  /* 色の名前の長さでボタンの位置が動かないように、
     スマホ縦向きは「1段目：色の名前／2段目：色を選ぶ・戻る（半分ずつ）」に固定する */
  .hud .pill{grid-column:1 / -1;justify-self:start;box-sizing:border-box;height:60px}   /* ふりがなの有無で高さが変わらないよう固定 */
  .hudbtns{display:contents}
  .hudbtns button{width:100%}
  /* 横向きなど幅が広い画面は1段。色の名前は残りの幅の中で左に置き、ボタンは右端に固定 */
  @media (min-width:560px){
    .hud{grid-template-columns:1fr auto auto}
    .hud .pill{grid-column:auto}
    .hudbtns button{width:auto}
  }
  .hud.off{opacity:0;pointer-events:none}
  .pill{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;border:3px solid #fff;border-radius:999px;padding:6px 16px;font-size:clamp(17px,4.8vw,20px);white-space:nowrap;font-weight:700;line-height:1.9;letter-spacing:.08em}
  .hud button{
    appearance:none;border:3px solid #fff;border-radius:999px;min-height:62px;padding:6px clamp(14px,4vw,24px);
    background:#000;color:#fff;font-size:clamp(18px,5vw,21px);white-space:nowrap;font-weight:700;line-height:1.8;letter-spacing:.1em;cursor:pointer
  }
  .hud button:focus-visible{outline-color:#FFE600}
  .toast p{margin:0}
  /* 点灯中の色選び（画面の下半分を押すと出る）
     設定画面と同じ「白地に黒い文字・濃い枠」にして、暗い会場でもボタンの境目と選択中の色がはっきり分かるようにする */
  .palette{
    position:fixed;left:0;right:0;bottom:0;z-index:2;max-height:100vh;max-height:100dvh;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));
    background:#F4F4F7;color:#111118;border-top:4px solid #111118;border-radius:22px 22px 0 0;
    display:flex;flex-direction:column;gap:10px;
  }
  .palhead{margin:0;text-align:center;text-wrap:balance;word-break:keep-all;color:#111118;font-size:17px;font-weight:700;line-height:2}
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .pc{
    appearance:none;position:relative;border:3px solid #83838F;border-radius:16px;background:#FFFFFF;color:#111118;
    min-height:54px;padding:4px 10px;display:flex;flex-direction:row;align-items:center;gap:clamp(8px,3vw,12px);text-align:left;cursor:pointer;
    font-size:clamp(15px,4.6vw,18px);font-weight:700;line-height:1.8;letter-spacing:.02em;white-space:nowrap;
  }
  .pc i{display:block;flex:none;width:clamp(30px,11vw,52px);height:30px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .pc[aria-pressed="true"]{border-color:#111118;border-width:5px;padding:2px 8px;box-shadow:0 0 0 2px #FFFFFF,0 0 16px -2px var(--c)}
  .ptabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pt{
    appearance:none;border:3px solid #83838F;border-radius:14px;background:#FFFFFF;color:#111118;cursor:pointer;
    min-height:54px;padding:4px 6px;font-size:clamp(15px,4.4vw,17px);font-weight:700;line-height:1.8;white-space:nowrap;
  }
  .pt[aria-pressed="true"]{background:#111118;color:#FFFFFF;border-color:#111118}
  .pt[aria-pressed="true"] rt{color:#E4E4EA}
  .pc b{
    position:absolute;top:-12px;right:-10px;min-width:32px;height:32px;padding:0 3px;box-sizing:border-box;border-radius:16px;
    background:#111118;color:#FFFFFF;border:3px solid #F4F4F7;font-size:16px;line-height:26px;text-align:center;letter-spacing:0;display:none
  }
  .pc[aria-pressed="true"] b{display:block}
  .ptools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .pm{
    appearance:none;border:3px solid #83838F;border-radius:14px;background:#FFFFFF;color:#111118;cursor:pointer;
    min-height:54px;padding:4px 4px;font-size:clamp(14px,4vw,16px);font-weight:700;line-height:1.8;white-space:nowrap;
  }
  .pdone{background:#111118;color:#FFFFFF;border-color:#111118}
  .ptools.one{grid-template-columns:1fr}
  .palette :focus-visible{outline:4px solid #0047FF;outline-offset:3px}
  /* 横向き・背の低い画面：パレットを横長にして画面からはみ出さないようにする */
  @media (max-height:520px){
    .palette{padding-top:10px;gap:8px}
    .pgrid{grid-template-columns:repeat(5,1fr);gap:8px}
    .pc{min-height:56px;flex-direction:column;justify-content:center;gap:2px;padding:4px;text-align:center}
    .pc[aria-pressed="true"]{padding:2px}
    .pc i{width:100%;height:18px}
    .pt,.pm{min-height:48px}
    .palhead{line-height:1.7}
  }
  .toast{
    position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:20px;right:20px;text-align:center;pointer-events:none;
    font-size:clamp(14px,4.2vw,18px);font-weight:700;letter-spacing:.02em;text-wrap:balance;word-break:keep-all;color:#fff;background:#000;border:3px solid #fff;border-radius:16px;
    padding:10px 12px;line-height:2;transition:opacity .4s
  }
  @media (prefers-reduced-motion: reduce){ .sw:active{transform:none} .hud,.toast{transition:none} }
</style>
</head>
<body>
<main class="setup" id="setup">
  <header>
    <h1>ペンライト</h1>
    <div class="rainbow" role="img" aria-label="使える10色の見本：赤、オレンジ、黄色、黄緑、緑、水色、青、紫、ピンク、白">
      <span style="background:#FF4233"></span><span style="background:#FF842F"></span><span style="background:#F0D100"></span><span style="background:#9DED00"></span><span style="background:#00C163"></span><span style="background:#00D3F9"></span><span style="background:#3A73FF"></span><span style="background:#A95AFF"></span><span style="background:#FF5AAF"></span><span style="background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)"></span>
    </div>
    <p class="rb"><ruby>光<rt>ひか</rt></ruby>り<ruby>方<rt>かた</rt></ruby>と<ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。</p>
  </header>

  <section aria-labelledby="modeLabel">
    <h2 id="modeLabel" class="rb"><span class="step" aria-hidden="true">1</span><span class="sr">手順1、</span><ruby>光<rt>ひか</rt></ruby>り<ruby>方<rt>かた</rt></ruby></h2>
    <div class="modes" role="group" aria-labelledby="modeLabel">
      <button id="m-single" aria-pressed="true" aria-describedby="d-single-sr">
        <span><span class="chk" aria-hidden="true">✓ </span>ずっと<ruby>点灯<rt>てんとう</rt></ruby></span>
        <small id="d-single">1<ruby>色<rt>しょく</rt></ruby>で<ruby>光<rt>ひか</rt></ruby>り<ruby>続<rt>つづ</rt></ruby>ける</small>
      </button>
      <button id="m-multi" aria-pressed="false" aria-describedby="d-multi-sr">
        <span><span class="chk" aria-hidden="true">✓ </span>カラーチェンジ</span>
        <small id="d-multi"><ruby>色<rt>いろ</rt></ruby>が<ruby>順番<rt>じゅんばん</rt></ruby>に<ruby>変<rt>か</rt></ruby>わる</small>
      </button>
    </div>
  </section>

  <section aria-labelledby="colorLabel">
    <h2 id="colorLabel"></h2>
    <div class="grid" id="grid" role="group" aria-labelledby="colorLabel"></div>
    <div id="multiTools" hidden>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="tools">
          <button class="mini" id="all">10<ruby>色<rt>しょく</rt></ruby>すべて</button>
          <button class="mini" id="clear"><ruby>全部<rt>ぜんぶ</rt></ruby>はずす</button>
        </div>
        <div class="seqbox">
          <h3 id="seqLabel" class="rb"><ruby>光<rt>ひか</rt></ruby>る<ruby>順番<rt>じゅんばん</rt></ruby></h3>
          <ol class="seq" id="seq" aria-labelledby="seqLabel"></ol>
        </div>
      </div>
    </div>
  </section>

  <div class="gowrap">
    <button class="go" id="go" aria-describedby="goHint"><ruby>点灯<rt>てんとう</rt></ruby>する</button>
    <p class="hint" id="goHint" aria-live="polite"></p>
    <ul class="note">
      <li class="rb"><ruby>明<rt>あか</rt></ruby>るさは スマホの<ruby>設定<rt>せってい</rt></ruby>で <ruby>最大<rt>さいだい</rt></ruby>に</li>
      <li class="rb"><ruby>光<rt>ひか</rt></ruby>っている<ruby>間<rt>あいだ</rt></ruby>に <ruby>画面<rt>がめん</rt></ruby>の<ruby>下<rt>した</rt></ruby>のほうを<ruby>押<rt>お</rt></ruby>すと <ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>べます</li>
      <li class="rb"><ruby>上<rt>うえ</rt></ruby>のほうを<ruby>押<rt>お</rt></ruby>すと 「<ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶ」「<ruby>戻<rt>もど</rt></ruby>る」ボタンが<ruby>出<rt>で</rt></ruby>ます</li>
    </ul>
  </div>
</main>

<div class="light" id="light" role="dialog" aria-modal="true" aria-label="点灯中" hidden>
  <div class="toast" id="toast">
    <p class="rb"><ruby>下<rt>した</rt></ruby>のほうを<ruby>押<rt>お</rt></ruby>すと <ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>べます</p>
    <p class="rb"><ruby>上<rt>うえ</rt></ruby>のほうを<ruby>押<rt>お</rt></ruby>すと ボタンが<ruby>出<rt>で</rt></ruby>ます</p>
  </div>
  <div class="hud" id="hud">
    <span class="pill" id="curName"></span>
    <div class="hudbtns">
      <button id="pick" data-label="1" aria-label="色を選ぶ"><span aria-hidden="true"><ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>ぶ</span></button>
      <button id="back"><ruby>戻<rt>もど</rt></ruby>る</button>
    </div>
  </div>
  <div class="palette" id="palette" role="group" aria-label="色を選ぶ" hidden>
    <div class="ptabs" role="group" aria-label="光り方">
      <button class="pt" id="pt-single" data-label="1" aria-label="ずっと点灯"><span aria-hidden="true">ずっと<ruby>点灯<rt>てんとう</rt></ruby></span></button>
      <button class="pt" id="pt-multi" data-label="1" aria-label="カラーチェンジ"><span aria-hidden="true">カラーチェンジ</span></button>
    </div>
    <p class="palhead" id="palLabel"></p>
    <div class="pgrid" id="pgrid"></div>
    <div class="ptools" id="ptools">
      <button class="pm" id="pall" data-label="1" aria-label="10色すべて"><span aria-hidden="true">10<ruby>色<rt>しょく</rt></ruby>すべて</span></button>
      <button class="pm" id="pclear" data-label="1" aria-label="全部はずす"><span aria-hidden="true"><ruby>全部<rt>ぜんぶ</rt></ruby>はずす</span></button>
      <button class="pm pdone" id="pdone" data-label="1" aria-label="決定して閉じる"><span id="pdoneTxt"></span></button>
    </div>
  </div>
  <div class="sr" id="announce2" role="status" aria-live="polite"></div>
</div>

<span id="d-single-sr" hidden>1色で光り続ける</span>
<span id="d-multi-sr" hidden>色が順番に変わる</span>

<div class="sr" id="announce" role="status" aria-live="polite"></div>

<script>
document.documentElement.lang = 'ja';

// 読み上げ用：ふりがな（rt）を除いた文字だけを取り出す
function plainText(html){
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('rt,[aria-hidden="true"]').forEach(n=>n.remove());
  return d.textContent.replace(/\s+/g,' ').trim();
}
// ふりがな付きの文は、画面には表示・読み上げは漢字のみ（二重読みを防ぐ）
function setRuby(el, html){
  el.innerHTML = `<span aria-hidden="true">${html}</span><span class="sr">${plainText(html)}</span>`;
}
function initRuby(){
  document.querySelectorAll('.rb').forEach(el=>{ if(!el.dataset.done){ setRuby(el, el.innerHTML); el.dataset.done=1; } });
  document.querySelectorAll('button').forEach(b=>{ if(!b.dataset.label) b.setAttribute('aria-label', plainText(b.querySelector('span:not(.chk)')?.innerHTML ?? b.innerHTML)); });
}
// 読み上げ：点灯中は点灯画面の中の読み上げ場所を使う
const say = t => {
  const a = document.getElementById(document.getElementById('light').hidden ? 'announce' : 'announce2');
  a.textContent=''; setTimeout(()=>a.textContent=t, 50);
};

const COLORS = [
  {id:'red',    hex:'#FF4233', plain:'赤',     name:'<ruby>赤<rt>あか</rt></ruby>'},
  {id:'orange', hex:'#FF842F', plain:'オレンジ', name:'オレンジ'},
  {id:'yellow', hex:'#F0D100', plain:'黄色',   name:'<ruby>黄色<rt>きいろ</rt></ruby>'},
  {id:'lime',   hex:'#9DED00', plain:'黄緑',   name:'<ruby>黄緑<rt>きみどり</rt></ruby>'},
  {id:'green',  hex:'#00C163', plain:'緑',     name:'<ruby>緑<rt>みどり</rt></ruby>'},
  {id:'sky',    hex:'#00D3F9', plain:'水色',   name:'<ruby>水色<rt>みずいろ</rt></ruby>'},
  {id:'blue',   hex:'#3A73FF', plain:'青',     name:'<ruby>青<rt>あお</rt></ruby>'},
  {id:'purple', hex:'#A95AFF', plain:'紫',     name:'<ruby>紫<rt>むらさき</rt></ruby>'},
  {id:'pink',   hex:'#FF5AAF', plain:'ピンク', name:'ピンク'},
  {id:'white',  hex:'#FFFFFF', plain:'白',     name:'<ruby>白<rt>しろ</rt></ruby>'},
];
const byId = Object.fromEntries(COLORS.map(c=>[c.id,c]));
// 色（白をのぞく9色）は、画面で見たときの明るさがそろうように調整（暗かった青・紫・緑を明るく、まぶしすぎた黄色・黄緑を少し抑えた）
// 黄緑と緑は見分けやすいように、黄緑を明るい若草色、緑を少し深い緑にして差を広げている
// カラーチェンジ：2秒点灯→1秒かけて黒へ→1秒かけて次の色へ
const P_HOLD = 2000, P_DOWN = 1000, P_UP = 1000, PULSE = P_HOLD+P_DOWN+P_UP;
// 点灯の最初だけ黒を入れる：黒1秒 → 1秒で最初の色へ（ふわっと光り始める）
const INTRO_HOLD = 1000, INTRO_FADE = 1000, INTRO = INTRO_HOLD+INTRO_FADE;
const INTRO_RGB = [0,0,0];   // 最初に挟む色（白にしたいときは [255,255,255]）
const $ = s => document.getElementById(s);
const SHOKU = '<ruby>色<rt>しょく</rt></ruby>';

let state = {mode:'single', single:'pink', multi:['red','yellow','sky','pink']};
try{
  const s = JSON.parse(localStorage.getItem('penlight')||'null');
  if(s && typeof s==='object'){
    if(s.mode==='single' || s.mode==='multi') state.mode = s.mode;
    if(byId[s.single]) state.single = s.single;
    if(Array.isArray(s.multi)) state.multi = [...new Set(s.multi.filter(id=>byId[id]))];
  }
}catch(e){}
const save = () => { try{ localStorage.setItem('penlight', JSON.stringify(state)); }catch(e){} };

const grid = $('grid');
COLORS.forEach(c=>{
  const b = document.createElement('button');
  b.className='sw'; b.id='sw-'+c.id; b.style.setProperty('--c',c.hex); b.dataset.label='1';
  b.innerHTML = `<i aria-hidden="true"></i><span aria-hidden="true">${c.name}</span><b aria-hidden="true"></b>`;
  b.onclick = () => pick(c.id);
  grid.appendChild(b);
});

function pick(id){
  const c = byId[id];
  if(state.mode==='single'){ state.single=id; say(`${c.plain}を選びました`); }
  else{
    const i = state.multi.indexOf(id);
    if(i>=0){ state.multi.splice(i,1); say(`${c.plain}をはずしました。全部で${state.multi.length}色`); }
    else{ state.multi.push(id); say(`${c.plain}を${state.multi.length}番目に追加しました`); }
  }
  save(); render();
}

function render(){
  const single = state.mode==='single';
  $('m-single').setAttribute('aria-pressed',single);
  $('m-multi').setAttribute('aria-pressed',!single);
  $('multiTools').hidden = single;
  setRuby($('colorLabel'), single
    ? `<span class="step" aria-hidden="true">2</span><span class="sr">手順2、</span><ruby>色<rt>いろ</rt></ruby>（1${SHOKU}）`
    : `<span class="step" aria-hidden="true">2</span><span class="sr">手順2、</span><ruby>色<rt>いろ</rt></ruby>（${state.multi.length} / ${COLORS.length}${SHOKU}）`);
  COLORS.forEach(c=>{
    const el = $('sw-'+c.id);
    const idx = state.multi.indexOf(c.id);
    const on = single ? state.single===c.id : idx>=0;
    el.classList.toggle('on',on);
    el.setAttribute('aria-pressed',on);
    el.setAttribute('aria-label', c.plain + (!single && on ? `、${idx+1}番目` : ''));
    el.querySelector('b').textContent = on ? (single ? '✓' : idx+1) : '';
  });
  const list = single ? [state.single] : state.multi;
  $('seq').innerHTML = list.length
    ? list.map((id,i)=>`<li class="${byId[id].dk?'dk':''}" style="--c:${byId[id].hex}"><span aria-hidden="true">${i+1}</span><span class="sr">${i+1}番目 ${byId[id].plain}</span></li>`).join('')
    : `<li class="empty"><span aria-hidden="true"><ruby>色<rt>いろ</rt></ruby>を<ruby>押<rt>お</rt></ruby>して<ruby>追加<rt>ついか</rt></ruby></span><span class="sr">色を押して追加してください</span></li>`;
  $('go').disabled = list.length===0;
  setRuby($('goHint'), list.length ? '' : `<ruby>色<rt>いろ</rt></ruby>を1つ<ruby>以上<rt>いじょう</rt></ruby><ruby>選<rt>えら</rt></ruby>んでください`);
  if(!list.length) $('goHint').hidden = false; else $('goHint').hidden = true;
  $('go').style.setProperty('--go', list[0]?byId[list[0]].hex:'transparent');
}
$('m-single').onclick = ()=>{state.mode='single';save();render();say('ずっと点灯を選びました');};
$('m-multi').onclick  = ()=>{state.mode='multi'; save();render();say('カラーチェンジを選びました');};
$('all').onclick   = ()=>{state.multi = COLORS.map(c=>c.id); save(); render(); say('10色すべてを選びました');};
$('clear').onclick = ()=>{state.multi = []; save(); render(); say('すべての色をはずしました');};
initRuby();
render();

// ---- 点灯 ----
const light = $('light'), hud = $('hud'), toast = $('toast'), setup = $('setup');
let raf=0, t0=0, seq=[], blink=false, wakeLock=null, hudTimer=0, toastTimer=0, lastName='', lastCss='', session=0, savedY=0;

const toRGB = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mkSeq = id => ({id, name:byId[id].name, hex:byId[id].hex, rgb:toRGB(byId[id].hex)});
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

// iPhoneのSafariは、上下のバー（ステータスバー・ツールバー）の色を
// ページの背景色とテーマカラーから決める。点灯中はそちらも同じ色に塗る。
let themeMeta = document.querySelector('meta[name="theme-color"]');
if(!themeMeta){ themeMeta = document.createElement('meta'); themeMeta.name = 'theme-color'; document.head.appendChild(themeMeta); }
// 設定画面ではテーマカラーをページの背景色（ライト／ダーク）に合わせる
function syncTheme(){ themeMeta.setAttribute('content', getComputedStyle(document.body).backgroundColor); }
syncTheme();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(light.hidden) syncTheme(); }); }catch(e){}

function paint(css){
  if(css===lastCss) return;            // 同じ色なら塗り直さない（無駄な再描画を防ぐ）
  lastCss = css;
  light.style.background = css;
  document.documentElement.style.backgroundColor = css;
  document.body.style.backgroundColor = css;
  themeMeta.setAttribute('content', css);
}
function unpaint(){
  lastCss = '';
  document.documentElement.style.backgroundColor = '';
  document.body.style.backgroundColor = '';
  syncTheme();
}

function frame(now){
  const n = seq.length;
  const el = Math.max(0, now-t0);
  let rgb, c;
  if(el < INTRO){
    // 最初だけ黒
    c = seq[0];
    const k = el < INTRO_HOLD ? 0 : ease((el-INTRO_HOLD)/INTRO_FADE);
    rgb = INTRO_RGB.map((v,j)=>Math.round(v+(seq[0].rgb[j]-v)*k));
  }
  else if(!blink){ c = seq[0]; rgb = c.rgb; }            // ずっと点灯：同じ色のまま
  else{
    // カラーチェンジ：2秒点灯 → 1秒かけて黒へ → 1秒かけて次の色へ（1色なら同じ色へ戻る）
    const e = (el-INTRO) % (PULSE*n);
    const i = Math.floor(e/PULSE), p = e - i*PULSE;
    const a = seq[i], b = seq[(i+1)%n];
    if(p < P_HOLD){ c = a; rgb = a.rgb; }
    else if(p < P_HOLD+P_DOWN){ c = a; const f = 1-ease((p-P_HOLD)/P_DOWN); rgb = a.rgb.map(v=>Math.round(v*f)); }
    else { c = b; const f = ease((p-P_HOLD-P_DOWN)/P_UP); rgb = b.rgb.map(v=>Math.round(v*f)); }
  }
  paint(`rgb(${rgb})`);
  if(c.name!==lastName){
    $('curName').innerHTML = `<i aria-hidden="true" style="display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:${c.hex}"></i>`;
    const t = document.createElement('span'); $('curName').appendChild(t); setRuby(t, c.name);
    lastName = c.name;
  }
  // ずっと点灯は、最初の黒が終われば色が変わらないのでアニメーションを止める（電池の節約）
  if(!blink && el >= INTRO){ raf = 0; return; }
  raf = requestAnimationFrame(frame);
}

async function keepAwake(){
  try{
    if(!('wakeLock' in navigator) || (wakeLock && !wakeLock.released)) return;
    const my = session;
    const lock = await navigator.wakeLock.request('screen');
    if(light.hidden || my!==session){ lock.release().catch(()=>{}); return; }   // すでに戻っていたら手放す
    wakeLock = lock;
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!light.hidden && document.visibilityState==='visible') keepAwake(); });

// 上のボタン（色の名前・色を選ぶ・戻る）は8秒で消す。
// キーボードやスイッチでボタンを選んでいる最中だけは消さずに延長する（タッチ操作では必ず消える）
function showHud(){
  hud.classList.remove('off'); clearTimeout(hudTimer);
  hudTimer = setTimeout(hideHud, 8000);
}
function hideHud(){
  let kb = false;
  try{ kb = !!hud.querySelector(':focus-visible'); }catch(e){}
  if(kb){ hudTimer = setTimeout(hideHud, 8000); return; }
  hud.classList.add('off');
}

function exitFull(){
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(document.webkitFullscreenElement) document.webkitExitFullscreen?.();
  }catch(e){}
}

$('go').onclick = async ()=>{
  const ids = state.mode==='single' ? [state.single] : state.multi;
  if(!ids.length || !light.hidden) return;
  seq = ids.map(mkSeq);
  blink = state.mode==='multi';
  lastName = ''; lastCss = '';
  const my = ++session;

  // 後ろの設定画面を完全に隠す（重なったまま表示・スクロールされてガタつくのを防ぐ）
  savedY = window.scrollY;
  setup.hidden = true;
  setup.inert = true;
  document.documentElement.classList.add('lit');
  window.scrollTo(0,0);
  light.hidden = false;

  // Androidの「戻る」操作でページから出てしまわないよう、履歴を1つ積む
  try{ history.pushState({penlight:1}, ''); }catch(e){}

  // 点灯は全画面の結果を待たずにすぐ始める
  t0 = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  keepAwake();
  showHud();
  clearTimeout(toastTimer); toast.style.opacity = 1; toastTimer = setTimeout(()=>toast.style.opacity=0, 4000);
  $('back').focus({preventScroll:true});
  try{
    const de = document.documentElement;
    const req = de.requestFullscreen ? de.requestFullscreen({navigationUI:'hide'}) : de.webkitRequestFullscreen?.();
    await req;
  }catch(e){}
  if(my!==session || light.hidden){ exitFull(); return; }
  say(state.mode==='single' ? `${byId[ids[0]].plain}で点灯しました` : `${ids.length}色のカラーチェンジで点灯しました`);
};
// ---- 点灯中の色選び ----
// 画面の下半分を押すとパレットが出る。
// ・ずっと点灯：押した色がそのまま光る
// ・カラーチェンジ：押した順に色が加わり、その順番で自動で変わる（もう一度押すとはずれる）
const palette = $('palette'), pgrid = $('pgrid');
let palTimer = 0, palMode = 'single';
COLORS.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'pc'; b.id = 'pc-'+c.id; b.dataset.label = '1';
  b.style.setProperty('--c', c.hex);
  b.innerHTML = `<i aria-hidden="true"></i><span aria-hidden="true">${c.name}</span><b aria-hidden="true"></b>`;
  b.onclick = () => palMode==='single' ? chooseColor(c.id) : toggleMulti(c.id);
  pgrid.appendChild(b);
});

function renderPalette(){
  const single = palMode==='single';
  $('pt-single').setAttribute('aria-pressed', single);
  $('pt-multi').setAttribute('aria-pressed', !single);
  // 下の段：カラーチェンジは「10色すべて・全部はずす・決定」、ずっと点灯は「閉じる」だけ（どちらでも必ず閉じられる）
  $('pall').hidden = single; $('pclear').hidden = single;
  $('ptools').classList.toggle('one', single);
  const n = state.multi.length;
  setRuby($('pdoneTxt'), single ? `<ruby>閉<rt>と</rt></ruby>じる` : `<ruby>決定<rt>けってい</rt></ruby>`);
  $('pdone').setAttribute('aria-label', single ? '閉じる' : '決定して閉じる');
  setRuby($('palLabel'), single
    ? `<ruby>色<rt>いろ</rt></ruby>を1つ<ruby>選<rt>えら</rt></ruby>んでください`
    : (n ? `<ruby>光<rt>ひか</rt></ruby>らせたい<ruby>色<rt>いろ</rt></ruby>を<ruby>順番<rt>じゅんばん</rt></ruby>に<ruby>押<rt>お</rt></ruby>す<span style="white-space:nowrap">（いま${n}${SHOKU}）</span>`
         : `<ruby>光<rt>ひか</rt></ruby>らせたい<ruby>色<rt>いろ</rt></ruby>を<ruby>順番<rt>じゅんばん</rt></ruby>に<ruby>押<rt>お</rt></ruby>してください`));
  COLORS.forEach(c=>{
    const el = $('pc-'+c.id), idx = state.multi.indexOf(c.id);
    const on = single ? (!blink && state.single===c.id) : idx>=0;
    el.setAttribute('aria-pressed', on);
    el.setAttribute('aria-label', c.plain + (!single && on ? `、${idx+1}番目` : ''));
    el.querySelector('b').textContent = on ? (single ? '✓' : idx+1) : '';
  });
}
function palKeep(){ clearTimeout(palTimer); palTimer = setTimeout(closePalette, 30000); }   // 30秒さわらなければ閉じる（ゆっくり選ぶ人のため長めに）
function openPalette(focus){
  palMode = blink ? 'multi' : 'single';
  renderPalette();
  palette.hidden = false;
  palKeep();
  palette.scrollTop = 0;
  if(focus) (pgrid.querySelector('[aria-pressed="true"]') || pgrid.firstChild).focus({preventScroll:true});
  say('色を選んでください');
}
// カラーチェンジの色を全部はずしたままなら、いま光っている並びに戻す（設定が空にならないように）
function restoreMultiIfEmpty(){
  if(blink && !state.multi.length){
    state.multi = seq.map(x=>x.id); save(); render();
    return true;
  }
  return false;
}
function closePalette(){
  clearTimeout(palTimer);
  if(palette.hidden) return;
  if(restoreMultiIfEmpty()) say('色が選ばれていないので、前の色の並びに戻しました');
  const hadFocus = palette.contains(document.activeElement);
  palette.hidden = true;
  if(hadFocus){ showHud(); $('pick').focus({preventScroll:true}); }
}
palette.addEventListener('pointerdown', palKeep);
palette.addEventListener('click', e=>e.stopPropagation());

function restartLoop(){ if(!raf) raf = requestAnimationFrame(frame); }

// ずっと点灯：その色で光り続ける
function chooseColor(id, keepOpen){
  const c = byId[id];
  state.mode = 'single'; state.single = id; save(); render();
  blink = false;
  seq = [mkSeq(id)];
  t0 = performance.now() - INTRO;          // 最初の黒の演出は飛ばして、すぐその色に
  restartLoop();
  if(keepOpen){ renderPalette(); palKeep(); } else { closePalette(); showHud(); }
  say(`${c.plain}にしました`);
}
// カラーチェンジ：選んだ順番で光らせる（j番目の色の点灯から始める）
function startMulti(j){
  state.mode = 'multi'; save(); render();
  blink = true;
  seq = state.multi.map(mkSeq);
  t0 = performance.now() - INTRO - j*PULSE;
  restartLoop();
}
// カラーチェンジの色を加える／はずす。加えた色はすぐ光らせて確かめられるようにする
function toggleMulti(id){
  const c = byId[id], i = state.multi.indexOf(id);
  if(i>=0){
    state.multi.splice(i,1);
    say(state.multi.length ? `${c.plain}をはずしました。全部で${state.multi.length}色` : `${c.plain}をはずしました。色を1つ以上押してください`);
    if(state.multi.length) startMulti(0); else save();
  }else{
    state.multi.push(id);
    startMulti(state.multi.length-1);
    say(`${c.plain}を${state.multi.length}番目に追加しました`);
  }
  render(); renderPalette(); palKeep();
}
$('pt-single').onclick = ()=>{ palMode = 'single'; chooseColor(state.single, true); };
$('pt-multi').onclick  = ()=>{
  palMode = 'multi';
  if(state.multi.length){ startMulti(0); say(`カラーチェンジ、${state.multi.length}色`); }
  else say('カラーチェンジ。光らせたい色を順番に押してください');
  renderPalette(); palKeep();
};
$('pall').onclick   = ()=>{ state.multi = COLORS.map(c=>c.id); startMulti(0); render(); renderPalette(); palKeep(); say('10色すべてを選びました'); };
$('pclear').onclick = ()=>{ state.multi = []; save(); render(); renderPalette(); palKeep(); say('すべての色をはずしました。光らせたい色を順番に押してください'); };
// 決定／閉じる：色を全部はずしていた場合は、closePalette が前の並びに戻す
$('pdone').onclick  = ()=>{
  // カラーチェンジは「決定」したら①番目の色から光り始める
  if(palMode==='multi' && state.multi.length) startMulti(0);
  closePalette(); showHud();
};

// 画面の下半分を押す → 色選びを出す／上半分を押す → 「戻る」を出す
// （色選びが出ているときに、その外を押すと閉じる）
light.addEventListener('click', e=>{
  if(e.target.closest('#back') || e.target.closest('#pick')) return;
  if(!palette.hidden){ closePalette(); return; }
  const y = e.clientY || 0;
  if(y >= window.innerHeight/2) openPalette(false); else showHud();
});
document.addEventListener('keydown', e=>{
  if(light.hidden) return;
  if(e.key==='Escape'){ if(!palette.hidden) closePalette(); else $('back').click(); return; }
  // 数字キー1〜9・0（1=赤 … 9=ピンク、0=白）：ふだんはその色に、カラーチェンジの色選び中は加える／はずす
  if(/^[0-9]$/.test(e.key)){
    const id = COLORS[e.key==='0' ? 9 : +e.key-1].id;
    if(!palette.hidden && palMode==='multi') toggleMulti(id); else chooseColor(id);
    return;
  }
  if(palette.hidden && (e.key==='ArrowDown' || e.key==='c' || e.key==='C')){ e.preventDefault(); openPalette(true); return; }
  if(!palette.hidden) palKeep(); else showHud();
});
// キーボードでボタンに移ったときだけ表示し直す（タップやプログラムでのフォーカスでは延長しない）
['back','pick'].forEach(id=>$(id).addEventListener('focus', e=>{
  let kb = false; try{ kb = e.target.matches(':focus-visible'); }catch(_){}
  if(kb) showHud();
}));
$('pick').onclick = e => { e.stopPropagation(); if(palette.hidden) openPalette(true); else closePalette(); };

function stopLight(){
  if(light.hidden) return;
  session++;
  cancelAnimationFrame(raf); raf = 0;
  clearTimeout(hudTimer); clearTimeout(toastTimer);
  restoreMultiIfEmpty();
  palette.hidden = true; clearTimeout(palTimer);
  light.hidden = true;
  unpaint();
  document.documentElement.classList.remove('lit');
  setup.hidden = false;
  setup.inert = false;
  window.scrollTo(0, savedY);
  const lock = wakeLock; wakeLock = null;
  lock?.release().catch(()=>{});
  exitFull();
  $('go').focus({preventScroll:true});
  say('点灯を終わりました');
}
// 「戻る」ボタン：積んだ履歴があればそれを戻す（popstateで消灯）
$('back').onclick = ()=>{
  if(history.state && history.state.penlight){ history.back(); }
  else stopLight();
};
// 端末の「戻る」操作（Androidの戻るボタン・スワイプ）で消灯する
window.addEventListener('popstate', ()=>{ if(!light.hidden) stopLight(); });
// 履歴を戻ったときにブラウザがスクロール位置を勝手に変えないようにする
try{ history.scrollRestoration = 'manual'; }catch(e){}
// ページ読み込み時に点灯用の履歴が残っていたら（再読み込みなど）、片付けておく
if(history.state && history.state.penlight){ try{ history.replaceState(null, ''); }catch(e){} }

// ---- オフライン対応 ----
// 一度開けば、電波がなくても動くように保存しておく（https で公開したときに有効）
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
